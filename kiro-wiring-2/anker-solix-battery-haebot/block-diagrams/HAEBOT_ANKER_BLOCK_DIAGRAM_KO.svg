<text x="166.00" y="176.20" font-size="2.2" text-anchor="middle" fill="#1565c0">Orbbec + 손목 웹캠</text><rect x="6" y="182.5" width="285" height="11.5" rx="1" fill="#fff8e1" stroke="#c62828" stroke-width="0.4"/><text x="8" y="186.6" font-size="2.35" fill="#c62828" font-weight="bold">확인 필요: USB-C 포트 하나가 바퀴와 젯슨을 함께 공급합니다. USB-C는 12 V에서 보통 3 A (36 W)입니다. 합치면 평균 약 3.3 A, 설계 부하 9 A.</text><text x="7" y="198.2" font-size="2.4" font-weight="bold" fill="#111">범례</text><line x1="22" y1="197.2" x2="34" y2="197.2" stroke="#c62828" stroke-width="0.8" marker-end="url(#m12)"/><text x="36" y="198.2" font-size="2.3" fill="#111">12 V</text><line x1="50" y1="197.2" x2="62" y2="197.2" stroke="#e65100" stroke-width="0.8" marker-end="url(#m5)"/><text x="64" y="198.2" font-size="2.3" fill="#111">5 V</text><line x1="76" y1="197.2" x2="88" y2="197.2" stroke="#1565c0" stroke-width="0.8" marker-end="url(#md)"/><text x="90" y="198.2" font-size="2.3" fill="#111">USB 데이터</text><line x1="118" y1="197.2" x2="130" y2="197.2" stroke="#2e7d32" stroke-width="0.8" marker-end="url(#mg)"/><text x="132" y="198.2" font-size="2.3" fill="#111">보호 / 비상정지</text><rect x="178" y="194.6" width="6" height="3.4" fill="none" stroke="#222" stroke-width="0.4"/><text x="186" y="197.6" font-size="2.15" fill="#111">실선 = 장착됨</text><rect x="214" y="194.6" width="6" height="3.4" fill="none" stroke="#1565c0" stroke-width="0.4" stroke-dasharray="1.2 0.8"/><text x="222" y="197.6" font-size="2.15" fill="#111">파란 점선 = 권장</text><text x="7" y="204.2" font-size="2.2" fill="#333">USB-C2의 12 V는 제작자 실측입니다 (앤커 설명서에는 USB-C 12 V 출력이 없음). 5 V PD 트리거의 암 2는 최대 3 A로 제한됩니다 (팔로워 설계 부하 5 A).</text></svg>
