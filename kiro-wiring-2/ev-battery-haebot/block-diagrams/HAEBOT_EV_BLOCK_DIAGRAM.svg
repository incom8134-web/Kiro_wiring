<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="294mm" viewBox="0 0 1600 1120" font-family="Malgun Gothic, Noto Sans CJK KR, Arial, sans-serif">
<rect width="1600" height="1120" fill="white"/>
<rect x="25" y="24" width="1550" height="1055" rx="8" fill="#ffffff" stroke="#183249" stroke-width="1.6"/>
<text x="48" y="66" font-size="29.00" font-weight="bold" fill="#183249">HAEBOT / KIRO - EV battery wiring</text>
<text x="48" y="97" font-size="17.00" font-weight="normal" fill="#183249">Rev B | 2026-11-26 | Both new arms: 12 V | One latching NC E-stop + DC contactor + Matek monitor</text>
<text x="48" y="122" font-size="15.00" font-weight="normal" fill="#a32c32">PROPOSED: battery, coil duty/current, I2C hookup and final protection ratings still require verification.</text>
<rect x="48" y="165" width="170" height="110" rx="8" fill="#fff7ee" stroke="#a32c32" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="62" y="193" font-size="18.00" font-weight="bold" fill="#a32c32">BT1</text>
<text x="62" y="217" font-size="15.00" font-weight="normal" fill="#183249">12 V / 45 Ah battery</text>
<text x="62" y="238" font-size="14.14" font-weight="normal" fill="#183249">Chemistry / BMS: TBD</text>
<text x="62" y="259" font-size="15.00" font-weight="normal" fill="#183249">Range: verify label</text>
<rect x="250" y="180" width="115" height="80" rx="8" fill="#f7fafc" stroke="#a32c32" stroke-width="1.6"/>
<text x="264" y="208" font-size="18.00" font-weight="bold" fill="#a32c32">F1</text>
<text x="264" y="232" font-size="15.00" font-weight="normal" fill="#183249">40 A* main</text>
<rect x="397" y="180" width="130" height="80" rx="8" fill="#f7fafc" stroke="#a32c32" stroke-width="1.6"/>
<text x="411" y="208" font-size="18.00" font-weight="bold" fill="#a32c32">SW1</text>
<text x="411" y="232" font-size="15.00" font-weight="normal" fill="#183249">Disconnect</text>
<rect x="560" y="158" width="230" height="124" rx="8" fill="#f7fafc" stroke="#6350a8" stroke-width="1.6"/>
<text x="574" y="186" font-size="18.00" font-weight="bold" fill="#6350a8">U6 Matek I2C-INA-BM</text>
<text x="574" y="210" font-size="15.00" font-weight="normal" fill="#183249">BAT+ → shunt → ESC+</text>
<text x="574" y="231" font-size="15.00" font-weight="normal" fill="#183249">0-85 V / 150 A continuous</text>
<text x="574" y="252" font-size="15.00" font-weight="normal" fill="#183249">Small pins: 5V G SDA SCL</text>
<polyline points="218,220 250,220" fill="none" stroke="#a32c32" stroke-width="3"/>
<polygon points="250.00,220.00 239.00,215.00 239.00,225.00" fill="#a32c32"/>
<polyline points="365,220 397,220" fill="none" stroke="#a32c32" stroke-width="3"/>
<polygon points="397.00,220.00 386.00,215.00 386.00,225.00" fill="#a32c32"/>
<polyline points="527,220 560,220" fill="none" stroke="#a32c32" stroke-width="3"/>
<polygon points="560.00,220.00 549.00,215.00 549.00,225.00" fill="#a32c32"/>
<polyline points="790,220 825,220 825,750" fill="none" stroke="#a32c32" stroke-width="3"/>
<text x="851" y="231" font-size="15.00" font-weight="normal" fill="#a32c32">BATT_MON: branch supply after monitor</text>
<rect x="875" y="295" width="180" height="110" rx="8" fill="#fff5f5" stroke="#cb263b" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="889" y="323" font-size="18.00" font-weight="bold" fill="#cb263b">K1</text>
<text x="889" y="347" font-size="15.00" font-weight="normal" fill="#183249">Main NO contact</text>
<text x="889" y="368" font-size="15.00" font-weight="normal" fill="#183249">Photo: 500A DC12V</text>
<text x="889" y="389" font-size="15.00" font-weight="normal" fill="#183249">Duty / rating: TBD</text>
<rect x="1090" y="295" width="195" height="110" rx="8" fill="#f7fafc" stroke="#cb263b" stroke-width="1.6"/>
<text x="1104" y="323" font-size="18.00" font-weight="bold" fill="#cb263b">U3</text>
<text x="1104" y="347" font-size="15.00" font-weight="normal" fill="#183249">12.0 V regulator</text>
<text x="1104" y="368" font-size="15.00" font-weight="normal" fill="#183249">≥20 A* candidate</text>
<text x="1104" y="389" font-size="15.00" font-weight="normal" fill="#183249">Battery-dependent</text>
<rect x="1320" y="295" width="230" height="190" rx="8" fill="#fff5f5" stroke="#cb263b" stroke-width="1.6"/>
<text x="1334" y="323" font-size="18.00" font-weight="bold" fill="#cb263b">FB1: 12 V MOTION</text>
<text x="1334" y="347" font-size="15.00" font-weight="normal" fill="#183249">F11 15 A → wheel adapter</text>
<text x="1334" y="368" font-size="15.00" font-weight="normal" fill="#183249">→ 4 wheel servos</text>
<text x="1334" y="389" font-size="15.00" font-weight="normal" fill="#183249">F12 10 A* → arm 1 adapter</text>
<text x="1334" y="410" font-size="15.00" font-weight="normal" fill="#183249">→ new 12 V arm 1</text>
<text x="1334" y="431" font-size="15.00" font-weight="normal" fill="#183249">F13 10 A* → arm 2 adapter</text>
<text x="1334" y="452" font-size="15.00" font-weight="normal" fill="#183249">→ new 12 V arm 2</text>
<circle cx="825" cy="350" r="5" fill="#a32c32"/>
<polyline points="825,350 875,350" fill="none" stroke="#a32c32" stroke-width="3"/>
<polygon points="875.00,350.00 864.00,345.00 864.00,355.00" fill="#a32c32"/>
<polyline points="1055,350 1090,350" fill="none" stroke="#cb263b" stroke-width="3"/>
<polygon points="1090.00,350.00 1079.00,345.00 1079.00,355.00" fill="#cb263b"/>
<polyline points="1285,350 1320,350" fill="none" stroke="#cb263b" stroke-width="3"/>
<polygon points="1320.00,350.00 1309.00,345.00 1309.00,355.00" fill="#cb263b"/>
<text x="875" y="443" font-size="17.00" font-weight="bold" fill="#cb263b">K1 opens: wheels + BOTH arms lose motor power.</text>
<text x="875" y="468" font-size="13.75" font-weight="normal" fill="#183249">U3 retained until full battery/servo voltage compatibility is verified.</text>
<rect x="875" y="523" width="410" height="93" rx="8" fill="#f7fafc" stroke="#6350a8" stroke-width="1.6"/>
<text x="889" y="551" font-size="18.00" font-weight="bold" fill="#6350a8">F3 5 A → U20 Jetson Orin Nano Super</text>
<text x="889" y="575" font-size="15.00" font-weight="normal" fill="#183249">DC jack: 9-20 V | cameras directly on USB</text>
<text x="889" y="596" font-size="15.00" font-weight="normal" fill="#183249">I2C GPIO: physical pins / bus / driver TBD</text>
<circle cx="825" cy="570" r="5" fill="#a32c32"/>
<polyline points="825,570 875,570" fill="none" stroke="#a32c32" stroke-width="3"/>
<polygon points="875.00,570.00 864.00,565.00 864.00,575.00" fill="#a32c32"/>
<polyline points="675,282 675,595 814,595" fill="none" stroke="#6350a8" stroke-width="3" stroke-dasharray="7 5"/>
<polyline points="836,595 875,595" fill="none" stroke="#6350a8" stroke-width="3" stroke-dasharray="7 5"/>
<polygon points="875.00,595.00 864.00,590.00 864.00,600.00" fill="#6350a8"/>
<text x="685" y="505" font-size="11.02" font-weight="normal" fill="#6350a8">SDA / SCL + G reference</text>
<text x="685" y="526" font-size="14.00" font-weight="normal" fill="#6350a8">I2C, not USB</text>
<rect x="875" y="674" width="260" height="109" rx="8" fill="#fff9ed" stroke="#c56a05" stroke-width="1.6"/>
<text x="889" y="702" font-size="18.00" font-weight="bold" fill="#c56a05">F4 10 A → U4 EA75-5V</text>
<text x="889" y="726" font-size="15.00" font-weight="normal" fill="#183249">8-40 V input → 5 V / 15 A</text>
<text x="889" y="747" font-size="15.00" font-weight="normal" fill="#183249">Stays on after E-stop</text>
<text x="889" y="768" font-size="15.00" font-weight="normal" fill="#183249">Measure 5.0-5.2 V first</text>
<rect x="1170" y="674" width="380" height="130" rx="8" fill="#fff9ed" stroke="#c56a05" stroke-width="1.6"/>
<text x="1184" y="702" font-size="18.00" font-weight="bold" fill="#c56a05">FB2: 5 V ONLY</text>
<text x="1184" y="726" font-size="15.00" font-weight="normal" fill="#183249">F21 3 A* → hub 1; F22 3 A* → hub 2</text>
<text x="1184" y="747" font-size="15.00" font-weight="normal" fill="#183249">Hub inputs / second hub presence: TBD</text>
<text x="1184" y="768" font-size="15.00" font-weight="normal" fill="#183249">F23 2 A* → J5 → U6 5V + auxiliary</text>
<text x="1184" y="789" font-size="15.00" font-weight="normal" fill="#183249">U6 logic: 5 V only; not battery voltage</text>
<circle cx="825" cy="730" r="5" fill="#a32c32"/>
<polyline points="825,730 875,730" fill="none" stroke="#a32c32" stroke-width="3"/>
<polygon points="875.00,730.00 864.00,725.00 864.00,735.00" fill="#a32c32"/>
<polyline points="1135,730 1170,730" fill="none" stroke="#c56a05" stroke-width="3"/>
<polygon points="1170.00,730.00 1159.00,725.00 1159.00,735.00" fill="#c56a05"/>
<text x="875" y="831" font-size="14.00" font-weight="normal" fill="#183249">USB data: Jetson ↔ hubs ↔ 3 servo adapters + lidar; no motor return through USB.</text>
<rect x="48" y="335" width="555" height="105" rx="8" fill="#f7fafc" stroke="#a32c32" stroke-width="1.6"/>
<text x="62" y="363" font-size="18.00" font-weight="bold" fill="#a32c32">J2 CHARGING (unchanged)</text>
<text x="62" y="387" font-size="15.00" font-weight="normal" fill="#183249">Charger → F2 15 A* → battery side of SW1</text>
<text x="62" y="408" font-size="15.00" font-weight="normal" fill="#183249">Charge only with SW1 OFF and the matching charger.</text>
<text x="62" y="429" font-size="15.00" font-weight="normal" fill="#183249">U6 placement measures discharge, not charging.</text>
<rect x="48" y="470" width="555" height="165" rx="8" fill="#f7fafc" stroke="#6350a8" stroke-width="1.6"/>
<text x="62" y="498" font-size="18.00" font-weight="bold" fill="#6350a8">POWER / SIGNAL NOTES</text>
<text x="62" y="522" font-size="15.00" font-weight="normal" fill="#183249">Each return → POWER_GND star bus → battery negative.</text>
<text x="62" y="543" font-size="15.00" font-weight="normal" fill="#183249">U6 high-current solder pads: main positive current only.</text>
<text x="62" y="564" font-size="15.00" font-weight="normal" fill="#183249">JST pins: 5 V electronics + I2C only; ground at star bus.</text>
<text x="62" y="585" font-size="15.00" font-weight="normal" fill="#183249">Check actual INA228/INA238, GPIO levels and pull-ups.</text>
<text x="62" y="606" font-size="15.00" font-weight="normal" fill="#183249">Default I2C address: decimal 69 / hex 0x45.</text>
<rect x="48" y="665" width="555" height="150" rx="8" fill="#f2faf5" stroke="#26744b" stroke-width="1.6"/>
<text x="62" y="693" font-size="18.00" font-weight="bold" fill="#26744b">WHAT THE STOP DOES</text>
<text x="62" y="717" font-size="15.00" font-weight="normal" fill="#183249">Released NC → coil powered → motion power ON.</text>
<text x="62" y="738" font-size="15.00" font-weight="normal" fill="#183249">Push / lock → coil OFF → wheels + arms OFF.</text>
<text x="62" y="759" font-size="15.00" font-weight="normal" fill="#183249">Mechanical latch holds OFF until twist release.</text>
<text x="62" y="780" font-size="15.00" font-weight="normal" fill="#183249">Jetson, hubs and monitor remain ON.</text>
<text x="48" y="867" font-size="18.00" font-weight="bold" fill="#26744b">HARDWARE COIL CONTROL - one latching NC E-stop, no START / RESET or auxiliary holding loop</text>
<rect x="48" y="891" width="205" height="75" rx="8" fill="#f7fafc" stroke="#a32c32" stroke-width="1.6"/>
<text x="62" y="919" font-size="18.00" font-weight="bold" fill="#a32c32">BATT_MON</text>
<text x="62" y="943" font-size="15.00" font-weight="normal" fill="#183249">After main protection</text>
<rect x="290" y="891" width="165" height="75" rx="8" fill="#f7fafc" stroke="#26744b" stroke-width="1.6"/>
<text x="304" y="919" font-size="18.00" font-weight="bold" fill="#26744b">F5 2 A*</text>
<text x="304" y="943" font-size="15.00" font-weight="normal" fill="#183249">Coil fuse: TBD</text>
<rect x="492" y="891" width="315" height="75" rx="8" fill="#f2faf5" stroke="#26744b" stroke-width="1.6"/>
<text x="506" y="919" font-size="18.00" font-weight="bold" fill="#26744b">S1: latching NC E-STOP</text>
<text x="506" y="943" font-size="15.00" font-weight="normal" fill="#183249">Push to lock / twist to release</text>
<rect x="844" y="891" width="280" height="75" rx="8" fill="#f7fafc" stroke="#26744b" stroke-width="1.6"/>
<text x="858" y="919" font-size="18.00" font-weight="bold" fill="#26744b">K1 COIL (small terminals)</text>
<text x="858" y="943" font-size="15.00" font-weight="normal" fill="#183249">Polarity / suppression: verify</text>
<rect x="1161" y="891" width="389" height="75" rx="8" fill="#f7fafc" stroke="#26744b" stroke-width="1.6"/>
<text x="1175" y="919" font-size="18.00" font-weight="bold" fill="#26744b">POWER_GND</text>
<text x="1175" y="943" font-size="15.00" font-weight="normal" fill="#183249">Battery-negative star bus</text>
<polyline points="253,929 290,929" fill="none" stroke="#26744b" stroke-width="3"/>
<polygon points="290.00,929.00 279.00,924.00 279.00,934.00" fill="#26744b"/>
<polyline points="455,929 492,929" fill="none" stroke="#26744b" stroke-width="3"/>
<polygon points="492.00,929.00 481.00,924.00 481.00,934.00" fill="#26744b"/>
<polyline points="807,929 844,929" fill="none" stroke="#26744b" stroke-width="3"/>
<polygon points="844.00,929.00 833.00,924.00 833.00,934.00" fill="#26744b"/>
<polyline points="1124,929 1161,929" fill="none" stroke="#26744b" stroke-width="3"/>
<polygon points="1161.00,929.00 1150.00,924.00 1150.00,934.00" fill="#26744b"/>
<text x="48" y="1004" font-size="18.00" font-weight="bold" fill="#cb263b">TWIST RELEASE RESTORES MOTOR POWER IMMEDIATELY. No restart interlock. Arms may fall when torque is lost.</text>
<text x="48" y="1032" font-size="14.00" font-weight="normal" fill="#a32c32">* Preliminary fuse/converter ratings. Single-contactor prototype power cut; not a validated safety system.</text>
<text x="48" y="1056" font-size="12.00" font-weight="normal" fill="#183249">Source: project Rev B wiring table + Matek manufacturer specifications. Physical pins and final ratings require confirmation.</text>
</svg>
