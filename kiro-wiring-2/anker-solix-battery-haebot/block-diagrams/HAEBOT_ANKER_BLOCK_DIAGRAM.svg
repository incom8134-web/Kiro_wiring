<text x="166.00" y="176.20" font-size="2.2" text-anchor="middle" fill="#1565c0">Orbbec + wrist webcam</text><rect x="6" y="182.5" width="285" height="11.5" rx="1" fill="#fff8e1" stroke="#c62828" stroke-width="0.4"/><text x="8" y="186.6" font-size="2.35" fill="#c62828" font-weight="bold">CHECK: one USB-C port feeds wheels AND Jetson. USB-C normally gives 3 A at 12 V (36 W). Together they need about 3.3 A typical and 9 A at design load.</text><text x="7" y="198.2" font-size="2.4" font-weight="bold" fill="#111">LEGEND</text><line x1="22" y1="197.2" x2="34" y2="197.2" stroke="#c62828" stroke-width="0.8" marker-end="url(#m12)"/><text x="36" y="198.2" font-size="2.3" fill="#111">12 V</text><line x1="50" y1="197.2" x2="62" y2="197.2" stroke="#e65100" stroke-width="0.8" marker-end="url(#m5)"/><text x="64" y="198.2" font-size="2.3" fill="#111">5 V</text><line x1="76" y1="197.2" x2="88" y2="197.2" stroke="#1565c0" stroke-width="0.8" marker-end="url(#md)"/><text x="90" y="198.2" font-size="2.3" fill="#111">USB data</text><line x1="118" y1="197.2" x2="130" y2="197.2" stroke="#2e7d32" stroke-width="0.8" marker-end="url(#mg)"/><text x="132" y="198.2" font-size="2.3" fill="#111">protection / E-stop</text><rect x="178" y="194.6" width="6" height="3.4" fill="none" stroke="#222" stroke-width="0.4"/><text x="186" y="197.6" font-size="2.15" fill="#111">solid = fitted</text><rect x="214" y="194.6" width="6" height="3.4" fill="none" stroke="#c62828" stroke-width="0.4" stroke-dasharray="1.2 0.8"/><text x="222" y="197.6" font-size="2.15" fill="#111">red dashed = BLOCKED</text><text x="7" y="204.2" font-size="2.2" fill="#333">12 V on USB-C2 is the builder's measurement; the Anker manual lists no 12 V USB-C profile. Arm 2 on a 5 V PD trigger is limited to 3 A (follower design load is 5 A).</text></svg>
