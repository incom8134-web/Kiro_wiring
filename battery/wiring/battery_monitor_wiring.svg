<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="48.0" y="56.0" fill="#1c2833" font-size="40" font-family="DejaVu Sans, sans-serif" font-weight="bold" text-anchor="start">Battery monitor wiring</text>
<text x="48.0" y="104.0" fill="#34495e" font-size="24" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start">Matek I2C-INA-BM on Jetson Orin Nano J12. Pack current is BAT+ to ESC+. JST-GH-4P is 5V, SCL, SDA, G.</text>
<text x="48.0" y="142.0" fill="#34495e" font-size="24" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start">UART pins 8 and 10 are optional and are not used. The app reads state.json.</text>
<rect x="40.0" y="180.0" width="460.0" height="900.0" rx="12" fill="#f7f9fb" stroke="#243140" stroke-width="2.5"/>
<rect x="860.0" y="180.0" width="500.0" height="900.0" rx="12" fill="#f7f9fb" stroke="#243140" stroke-width="2.5"/>
<rect x="1760.0" y="180.0" width="590.0" height="760.0" rx="12" fill="#f7f9fb" stroke="#243140" stroke-width="2.5"/>
<rect x="1760.0" y="980.0" width="590.0" height="420.0" rx="12" fill="#f7f9fb" stroke="#243140" stroke-width="2.5"/>
<text x="64.0" y="230.0" fill="#1c2833" font-size="32" font-family="DejaVu Sans, sans-serif" font-weight="bold" text-anchor="start">Pack current</text>
<text x="64.0" y="274.0" fill="#34495e" font-size="24" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start">through the module</text>
<text x="64.0" y="340.0" fill="#1c2833" font-size="28" font-family="DejaVu Sans, sans-serif" font-weight="bold" text-anchor="start">BAT+  battery side</text>
<text x="64.0" y="400.0" fill="#1c2833" font-size="28" font-family="DejaVu Sans, sans-serif" font-weight="bold" text-anchor="start">ESC+  load side</text>
<text x="64.0" y="470.0" fill="#34495e" font-size="24" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start">200 µΩ path, on the board</text>
<text x="64.0" y="520.0" fill="#34495e" font-size="24" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start">0–85 V, 150 A continuous</text>
<text x="64.0" y="570.0" fill="#34495e" font-size="24" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start">204.8 A burst</text>
<text x="64.0" y="660.0" fill="#34495e" font-size="24" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start">Power leads do not go to</text>
<text x="64.0" y="700.0" fill="#34495e" font-size="24" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start">the Jetson header.</text>
<text x="64.0" y="760.0" fill="#34495e" font-size="24" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start">YOLTON e-bike pack</text>
<text x="64.0" y="800.0" fill="#34495e" font-size="24" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start">Coupang 9101801616.</text>
<text x="64.0" y="840.0" fill="#34495e" font-size="24" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start">Chemistry, V, and Ah: TODO.</text>
<text x="64.0" y="890.0" fill="#34495e" font-size="24" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start">Wire gauge is not chosen.</text>
<text x="64.0" y="940.0" fill="#34495e" font-size="24" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start">Pack current is unknown.</text>
<text x="64.0" y="1000.0" fill="#34495e" font-size="22" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start">Positive current = discharge</text>
<polyline points="500.0,360.0 860.0,360.0" fill="none" stroke="#6c3483" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="680.0" y="346.0" fill="#6c3483" font-size="24" font-family="DejaVu Sans, sans-serif" font-weight="bold" text-anchor="middle">BAT+  →  ESC+</text>
<text x="884.0" y="230.0" fill="#1c2833" font-size="32" font-family="DejaVu Sans, sans-serif" font-weight="bold" text-anchor="start">Matek I2C-INA-BM</text>
<text x="884.0" y="274.0" fill="#34495e" font-size="24" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start">address 0x45 (dec 69)</text>
<text x="884.0" y="318.0" fill="#34495e" font-size="22" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start">jumpers open. Also 0x44, 0x41</text>
<text x="884.0" y="390.0" fill="#1c2833" font-size="26" font-family="DejaVu Sans, sans-serif" font-weight="bold" text-anchor="start">JST-GH-4P</text>
<text x="1180.0" y="450.0" fill="#1a5276" font-size="26" font-family="DejaVu Sans, sans-serif" font-weight="bold" text-anchor="end">SDA</text>
<text x="1180.0" y="560.0" fill="#9a7d0a" font-size="26" font-family="DejaVu Sans, sans-serif" font-weight="bold" text-anchor="end">SCL</text>
<text x="1180.0" y="680.0" fill="#d35400" font-size="26" font-family="DejaVu Sans, sans-serif" font-weight="bold" text-anchor="end">5V  4–9 V</text>
<text x="1180.0" y="800.0" fill="#1a1a1a" font-size="26" font-family="DejaVu Sans, sans-serif" font-weight="bold" text-anchor="end">G</text>
<text x="884.0" y="900.0" fill="#34495e" font-size="22" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start">Shunt is on the module.</text>
<text x="884.0" y="950.0" fill="#34495e" font-size="22" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start">I2C only. No UART pins.</text>
<text x="884.0" y="1000.0" fill="#34495e" font-size="22" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start">i2cdetect -y -r 7 shows 0x45</text>
<polyline points="1360.0,450.0 1760.0,450.0" fill="none" stroke="#1a5276" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1560.0" y="436.0" fill="#1a5276" font-size="24" font-family="DejaVu Sans, sans-serif" font-weight="bold" text-anchor="middle">SDA</text>
<polyline points="1360.0,560.0 1760.0,560.0" fill="none" stroke="#9a7d0a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1560.0" y="546.0" fill="#9a7d0a" font-size="24" font-family="DejaVu Sans, sans-serif" font-weight="bold" text-anchor="middle">SCL</text>
<polyline points="1360.0,680.0 1760.0,680.0" fill="none" stroke="#d35400" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1560.0" y="666.0" fill="#d35400" font-size="24" font-family="DejaVu Sans, sans-serif" font-weight="bold" text-anchor="middle">5 V</text>
<polyline points="1360.0,800.0 1760.0,800.0" fill="none" stroke="#1a1a1a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1560.0" y="786.0" fill="#1a1a1a" font-size="24" font-family="DejaVu Sans, sans-serif" font-weight="bold" text-anchor="middle">GND</text>
<text x="1560.0" y="900.0" fill="#1c2833" font-size="24" font-family="DejaVu Sans, sans-serif" font-weight="bold" text-anchor="middle">JST-GH-4P to J12</text>
<text x="1784.0" y="224.0" fill="#1c2833" font-size="32" font-family="DejaVu Sans, sans-serif" font-weight="bold" text-anchor="start">Jetson Orin Nano</text>
<text x="1784.0" y="268.0" fill="#34495e" font-size="26" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start">J12    /dev/i2c-7</text>
<text x="1784.0" y="330.0" fill="#1a5276" font-size="28" font-family="DejaVu Sans, sans-serif" font-weight="bold" text-anchor="start">pin 3    I2C1_SDA</text>
<text x="1784.0" y="384.0" fill="#9a7d0a" font-size="28" font-family="DejaVu Sans, sans-serif" font-weight="bold" text-anchor="start">pin 5    I2C1_SCL</text>
<text x="1784.0" y="438.0" fill="#d35400" font-size="28" font-family="DejaVu Sans, sans-serif" font-weight="bold" text-anchor="start">pin 2    5 V logic</text>
<text x="1784.0" y="492.0" fill="#1c2833" font-size="28" font-family="DejaVu Sans, sans-serif" font-weight="bold" text-anchor="start">pin 6    GND</text>
<text x="1784.0" y="556.0" fill="#34495e" font-size="22" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start">Pin 1 (3.3 V) is nearest</text>
<text x="1784.0" y="588.0" fill="#34495e" font-size="22" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start">the USB and Ethernet ports.</text>
<text x="1784.0" y="620.0" fill="#34495e" font-size="22" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start">Pins 39 and 40 face the fan.</text>
<text x="1784.0" y="652.0" fill="#34495e" font-size="22" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start">Meter: pin 1 = 3.3 V, pin 2 = 5 V.</text>
<text x="1784.0" y="704.0" fill="#34495e" font-size="22" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start">I2C is 3.3 V, not 5 V tolerant.</text>
<text x="1784.0" y="736.0" fill="#34495e" font-size="22" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start">If SDA idle is above ~3.6 V,</text>
<text x="1784.0" y="768.0" fill="#34495e" font-size="22" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start">use a BSS138 level shifter.</text>
<text x="1784.0" y="820.0" fill="#34495e" font-size="22" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start">Do not use pin 4.</text>
<text x="1784.0" y="852.0" fill="#34495e" font-size="22" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start">No pack voltage on the header.</text>
<text x="1784.0" y="1028.0" fill="#1c2833" font-size="32" font-family="DejaVu Sans, sans-serif" font-weight="bold" text-anchor="start">UART output</text>
<text x="1784.0" y="1076.0" fill="#34495e" font-size="26" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start">OPTIONAL — not used</text>
<text x="1784.0" y="1140.0" fill="#196f3d" font-size="26" font-family="DejaVu Sans, sans-serif" font-weight="bold" text-anchor="start">pin 8     TX   /dev/ttyTHS0</text>
<text x="1784.0" y="1194.0" fill="#566573" font-size="26" font-family="DejaVu Sans, sans-serif" font-weight="bold" text-anchor="start">pin 10    RX   /dev/ttyTHS0</text>
<text x="1784.0" y="1260.0" fill="#34495e" font-size="22" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start">Off unless uart_enabled is true.</text>
<text x="1784.0" y="1296.0" fill="#34495e" font-size="22" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start">Live path: I2C, then state.json,</text>
<text x="1784.0" y="1332.0" fill="#34495e" font-size="22" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start">then the HAEBOT web app.</text>
<text x="48.0" y="1488.0" fill="#34495e" font-size="22" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start">Matek I2C-INA-BM (mateksys.com). TI INA228 SLYS021. NVIDIA SP-11324-001 header J12. Linux map: jetsonhacks.com Orin Nano pinout.</text>
<text x="48.0" y="1532.0" fill="#34495e" font-size="22" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start">Pins 3 and 5 are I2C1, /dev/i2c-7. sudo i2cdetect -y -r 7 should show 0x45. Pins 8 and 10 are UART1, /dev/ttyTHS0, unused. Signals are 3.3 V.</text>
</svg>
