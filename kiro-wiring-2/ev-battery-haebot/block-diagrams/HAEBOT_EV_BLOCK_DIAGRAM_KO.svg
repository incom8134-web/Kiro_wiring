<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="294mm" viewBox="0 0 1600 1120" font-family="Malgun Gothic, Noto Sans CJK KR, Arial, sans-serif">
<rect width="1600" height="1120" fill="white"/>
<rect x="25" y="24" width="1550" height="1055" rx="8" fill="#ffffff" stroke="#183249" stroke-width="1.6"/>
<text x="48" y="66" font-size="29.00" font-weight="bold" fill="#183249">HAEBOT / KIRO - EV 배터리 배선 구성도</text>
<text x="48" y="97" font-size="17.00" font-weight="normal" fill="#183249">Rev B | 2026-11-26 | 새 로봇팔 2개: 12 V | 래칭 NC 비상정지 1개 + DC 접촉기 + Matek 모니터</text>
<text x="48" y="122" font-size="15.00" font-weight="normal" fill="#a32c32">제안 설계: 배터리, 코일 연속 통전/전류, I2C 연결 및 최종 보호 정격은 확인 필요.</text>
<rect x="48" y="165" width="170" height="110" rx="8" fill="#fff7ee" stroke="#a32c32" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="62" y="193" font-size="18.00" font-weight="bold" fill="#a32c32">BT1</text>
<text x="62" y="217" font-size="15.00" font-weight="normal" fill="#183249">12 V / 45 Ah 배터리</text>
<text x="62" y="238" font-size="14.62" font-weight="normal" fill="#183249">화학계 / BMS: 미확인</text>
<text x="62" y="259" font-size="15.00" font-weight="normal" fill="#183249">전압 범위: 라벨 확인</text>
<rect x="250" y="180" width="115" height="80" rx="8" fill="#f7fafc" stroke="#a32c32" stroke-width="1.6"/>
<text x="264" y="208" font-size="18.00" font-weight="bold" fill="#a32c32">F1</text>
<text x="264" y="232" font-size="15.00" font-weight="normal" fill="#183249">40 A* 메인</text>
<rect x="397" y="180" width="130" height="80" rx="8" fill="#f7fafc" stroke="#a32c32" stroke-width="1.6"/>
<text x="411" y="208" font-size="18.00" font-weight="bold" fill="#a32c32">SW1</text>
<text x="411" y="232" font-size="15.00" font-weight="normal" fill="#183249">메인 차단기</text>
<rect x="560" y="158" width="230" height="124" rx="8" fill="#f7fafc" stroke="#6350a8" stroke-width="1.6"/>
<text x="574" y="186" font-size="18.00" font-weight="bold" fill="#6350a8">U6 Matek I2C-INA-BM</text>
<text x="574" y="210" font-size="15.00" font-weight="normal" fill="#183249">BAT+ → 션트 → ESC+</text>
<text x="574" y="231" font-size="15.00" font-weight="normal" fill="#183249">0-85 V / 연속 150 A</text>
<text x="574" y="252" font-size="15.00" font-weight="normal" fill="#183249">소신호 핀: 5V G SDA SCL</text>
<polyline points="218,220 250,220" fill="none" stroke="#a32c32" stroke-width="3"/>
<polygon points="250.00,220.00 239.00,215.00 239.00,225.00" fill="#a32c32"/>
<polyline points="365,220 397,220" fill="none" stroke="#a32c32" stroke-width="3"/>
<polygon points="397.00,220.00 386.00,215.00 386.00,225.00" fill="#a32c32"/>
<polyline points="527,220 560,220" fill="none" stroke="#a32c32" stroke-width="3"/>
<polygon points="560.00,220.00 549.00,215.00 549.00,225.00" fill="#a32c32"/>
<polyline points="790,220 825,220 825,750" fill="none" stroke="#a32c32" stroke-width="3"/>
<text x="851" y="231" font-size="15.00" font-weight="normal" fill="#a32c32">BATT_MON: 모니터 뒤 분기 전원</text>
<rect x="875" y="295" width="180" height="110" rx="8" fill="#fff5f5" stroke="#cb263b" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="889" y="323" font-size="18.00" font-weight="bold" fill="#cb263b">K1</text>
<text x="889" y="347" font-size="15.00" font-weight="normal" fill="#183249">메인 NO 접점</text>
<text x="889" y="368" font-size="14.24" font-weight="normal" fill="#183249">사진 라벨: 500A DC12V</text>
<text x="889" y="389" font-size="14.07" font-weight="normal" fill="#183249">연속 통전 / 정격 미확인</text>
<rect x="1090" y="295" width="195" height="110" rx="8" fill="#f7fafc" stroke="#cb263b" stroke-width="1.6"/>
<text x="1104" y="323" font-size="18.00" font-weight="bold" fill="#cb263b">U3</text>
<text x="1104" y="347" font-size="15.00" font-weight="normal" fill="#183249">12.0 V 정전압 장치</text>
<text x="1104" y="368" font-size="15.00" font-weight="normal" fill="#183249">≥20 A* 후보</text>
<text x="1104" y="389" font-size="15.00" font-weight="normal" fill="#183249">배터리에 따라 필요</text>
<rect x="1320" y="295" width="230" height="190" rx="8" fill="#fff5f5" stroke="#cb263b" stroke-width="1.6"/>
<text x="1334" y="323" font-size="18.00" font-weight="bold" fill="#cb263b">FB1: 12 V 구동</text>
<text x="1334" y="347" font-size="15.00" font-weight="normal" fill="#183249">F11 15 A → 바퀴 어댑터</text>
<text x="1334" y="368" font-size="15.00" font-weight="normal" fill="#183249">→ 바퀴 서보 4개</text>
<text x="1334" y="389" font-size="15.00" font-weight="normal" fill="#183249">F12 10 A* → 팔 1 어댑터</text>
<text x="1334" y="410" font-size="15.00" font-weight="normal" fill="#183249">→ 새 12 V 팔 1</text>
<text x="1334" y="431" font-size="15.00" font-weight="normal" fill="#183249">F13 10 A* → 팔 2 어댑터</text>
<text x="1334" y="452" font-size="15.00" font-weight="normal" fill="#183249">→ 새 12 V 팔 2</text>
<circle cx="825" cy="350" r="5" fill="#a32c32"/>
<polyline points="825,350 875,350" fill="none" stroke="#a32c32" stroke-width="3"/>
<polygon points="875.00,350.00 864.00,345.00 864.00,355.00" fill="#a32c32"/>
<polyline points="1055,350 1090,350" fill="none" stroke="#cb263b" stroke-width="3"/>
<polygon points="1090.00,350.00 1079.00,345.00 1079.00,355.00" fill="#cb263b"/>
<polyline points="1285,350 1320,350" fill="none" stroke="#cb263b" stroke-width="3"/>
<polygon points="1320.00,350.00 1309.00,345.00 1309.00,355.00" fill="#cb263b"/>
<text x="875" y="443" font-size="17.00" font-weight="bold" fill="#cb263b">K1 개방: 바퀴와 양쪽 팔의 모터 전원 차단.</text>
<text x="875" y="468" font-size="14.00" font-weight="normal" fill="#183249">배터리 전체 전압 범위와 서보 호환성 확인 전까지 U3 유지.</text>
<rect x="875" y="523" width="410" height="93" rx="8" fill="#f7fafc" stroke="#6350a8" stroke-width="1.6"/>
<text x="889" y="551" font-size="18.00" font-weight="bold" fill="#6350a8">F3 5 A → U20 Jetson Orin Nano Super</text>
<text x="889" y="575" font-size="15.00" font-weight="normal" fill="#183249">DC 잭: 9-20 V | 카메라는 USB 직접 연결</text>
<text x="889" y="596" font-size="15.00" font-weight="normal" fill="#183249">I2C GPIO: 실제 핀 / 버스 / 드라이버 미확인</text>
<circle cx="825" cy="570" r="5" fill="#a32c32"/>
<polyline points="825,570 875,570" fill="none" stroke="#a32c32" stroke-width="3"/>
<polygon points="875.00,570.00 864.00,565.00 864.00,575.00" fill="#a32c32"/>
<polyline points="675,282 675,595 814,595" fill="none" stroke="#6350a8" stroke-width="3" stroke-dasharray="7 5"/>
<polyline points="836,595 875,595" fill="none" stroke="#6350a8" stroke-width="3" stroke-dasharray="7 5"/>
<polygon points="875.00,595.00 864.00,590.00 864.00,600.00" fill="#6350a8"/>
<text x="685" y="505" font-size="13.69" font-weight="normal" fill="#6350a8">SDA / SCL + G 기준</text>
<text x="685" y="526" font-size="14.00" font-weight="normal" fill="#6350a8">I2C, USB 아님</text>
<rect x="875" y="674" width="260" height="109" rx="8" fill="#fff9ed" stroke="#c56a05" stroke-width="1.6"/>
<text x="889" y="702" font-size="18.00" font-weight="bold" fill="#c56a05">F4 10 A → U4 EA75-5V</text>
<text x="889" y="726" font-size="15.00" font-weight="normal" fill="#183249">8-40 V 입력 → 5 V / 15 A</text>
<text x="889" y="747" font-size="15.00" font-weight="normal" fill="#183249">비상정지 후에도 전원 유지</text>
<text x="889" y="768" font-size="15.00" font-weight="normal" fill="#183249">먼저 5.0-5.2 V 측정</text>
<rect x="1170" y="674" width="380" height="130" rx="8" fill="#fff9ed" stroke="#c56a05" stroke-width="1.6"/>
<text x="1184" y="702" font-size="18.00" font-weight="bold" fill="#c56a05">FB2: 5 V 전용</text>
<text x="1184" y="726" font-size="15.00" font-weight="normal" fill="#183249">F21 3 A* → 허브 1; F22 3 A* → 허브 2</text>
<text x="1184" y="747" font-size="15.00" font-weight="normal" fill="#183249">허브 입력 전압 / 허브 2 장착 여부: 미확인</text>
<text x="1184" y="768" font-size="15.00" font-weight="normal" fill="#183249">F23 2 A* → J5 → U6 5V + 보조 전원</text>
<text x="1184" y="789" font-size="15.00" font-weight="normal" fill="#183249">U6 회로 전원: 5 V, 배터리 직결 금지</text>
<circle cx="825" cy="730" r="5" fill="#a32c32"/>
<polyline points="825,730 875,730" fill="none" stroke="#a32c32" stroke-width="3"/>
<polygon points="875.00,730.00 864.00,725.00 864.00,735.00" fill="#a32c32"/>
<polyline points="1135,730 1170,730" fill="none" stroke="#c56a05" stroke-width="3"/>
<polygon points="1170.00,730.00 1159.00,725.00 1159.00,735.00" fill="#c56a05"/>
<text x="875" y="831" font-size="14.00" font-weight="normal" fill="#183249">USB 데이터: Jetson ↔ 허브 ↔ 서보 어댑터 3개 + 라이다; USB로 모터 전류 귀환 금지.</text>
<rect x="48" y="335" width="555" height="105" rx="8" fill="#f7fafc" stroke="#a32c32" stroke-width="1.6"/>
<text x="62" y="363" font-size="18.00" font-weight="bold" fill="#a32c32">J2 충전 (기존 구성 유지)</text>
<text x="62" y="387" font-size="15.00" font-weight="normal" fill="#183249">충전기 → F2 15 A* → SW1의 배터리 측</text>
<text x="62" y="408" font-size="15.00" font-weight="normal" fill="#183249">SW1 OFF 상태에서 배터리에 맞는 충전기로만 충전.</text>
<text x="62" y="429" font-size="15.00" font-weight="normal" fill="#183249">이 U6 위치는 방전만 측정하며 충전 전류는 측정하지 않음.</text>
<rect x="48" y="470" width="555" height="165" rx="8" fill="#f7fafc" stroke="#6350a8" stroke-width="1.6"/>
<text x="62" y="498" font-size="18.00" font-weight="bold" fill="#6350a8">전원 / 신호 주의사항</text>
<text x="62" y="522" font-size="15.00" font-weight="normal" fill="#183249">각 장치 귀환선 → POWER_GND 스타 버스 → 배터리 음극.</text>
<text x="62" y="543" font-size="15.00" font-weight="normal" fill="#183249">U6 대전류 납땜 패드: 메인 양극 전류 경로.</text>
<text x="62" y="564" font-size="15.00" font-weight="normal" fill="#183249">JST 핀: 5 V 회로 전원과 I2C 전용; G는 음극 스타 버스.</text>
<text x="62" y="585" font-size="15.00" font-weight="normal" fill="#183249">실제 INA228/INA238, GPIO 전압 및 풀업 확인 필요.</text>
<text x="62" y="606" font-size="15.00" font-weight="normal" fill="#183249">기본 I2C 주소: 10진수 69 / 16진수 0x45.</text>
<rect x="48" y="665" width="555" height="150" rx="8" fill="#f2faf5" stroke="#26744b" stroke-width="1.6"/>
<text x="62" y="693" font-size="18.00" font-weight="bold" fill="#26744b">비상정지 동작</text>
<text x="62" y="717" font-size="15.00" font-weight="normal" fill="#183249">NC 해제 상태 → 코일 통전 → 구동 전원 ON.</text>
<text x="62" y="738" font-size="15.00" font-weight="normal" fill="#183249">누름 / 잠금 → 코일 OFF → 바퀴와 팔 전원 OFF.</text>
<text x="62" y="759" font-size="15.00" font-weight="normal" fill="#183249">기계식 래치가 돌려 해제할 때까지 OFF 유지.</text>
<text x="62" y="780" font-size="15.00" font-weight="normal" fill="#183249">Jetson, 허브 및 모니터 전원은 ON 유지.</text>
<text x="48" y="867" font-size="18.00" font-weight="bold" fill="#26744b">하드웨어 코일 제어 - 래칭 NC 비상정지 1개, START / RESET 버튼 및 보조 유지 회로 없음</text>
<rect x="48" y="891" width="205" height="75" rx="8" fill="#f7fafc" stroke="#a32c32" stroke-width="1.6"/>
<text x="62" y="919" font-size="18.00" font-weight="bold" fill="#a32c32">BATT_MON</text>
<text x="62" y="943" font-size="15.00" font-weight="normal" fill="#183249">메인 보호 장치 이후</text>
<rect x="290" y="891" width="165" height="75" rx="8" fill="#f7fafc" stroke="#26744b" stroke-width="1.6"/>
<text x="304" y="919" font-size="18.00" font-weight="bold" fill="#26744b">F5 2 A*</text>
<text x="304" y="943" font-size="14.77" font-weight="normal" fill="#183249">코일 퓨즈: 확인 필요</text>
<rect x="492" y="891" width="315" height="75" rx="8" fill="#f2faf5" stroke="#26744b" stroke-width="1.6"/>
<text x="506" y="919" font-size="18.00" font-weight="bold" fill="#26744b">S1: 래칭 NC 비상정지</text>
<text x="506" y="943" font-size="15.00" font-weight="normal" fill="#183249">눌러 잠금 / 돌려 해제</text>
<rect x="844" y="891" width="280" height="75" rx="8" fill="#f7fafc" stroke="#26744b" stroke-width="1.6"/>
<text x="858" y="919" font-size="18.00" font-weight="bold" fill="#26744b">K1 코일 (소형 단자)</text>
<text x="858" y="943" font-size="15.00" font-weight="normal" fill="#183249">극성 / 서지 억제 방식 확인</text>
<rect x="1161" y="891" width="389" height="75" rx="8" fill="#f7fafc" stroke="#26744b" stroke-width="1.6"/>
<text x="1175" y="919" font-size="18.00" font-weight="bold" fill="#26744b">POWER_GND</text>
<text x="1175" y="943" font-size="15.00" font-weight="normal" fill="#183249">배터리 음극 스타 버스</text>
<polyline points="253,929 290,929" fill="none" stroke="#26744b" stroke-width="3"/>
<polygon points="290.00,929.00 279.00,924.00 279.00,934.00" fill="#26744b"/>
<polyline points="455,929 492,929" fill="none" stroke="#26744b" stroke-width="3"/>
<polygon points="492.00,929.00 481.00,924.00 481.00,934.00" fill="#26744b"/>
<polyline points="807,929 844,929" fill="none" stroke="#26744b" stroke-width="3"/>
<polygon points="844.00,929.00 833.00,924.00 833.00,934.00" fill="#26744b"/>
<polyline points="1124,929 1161,929" fill="none" stroke="#26744b" stroke-width="3"/>
<polygon points="1161.00,929.00 1150.00,924.00 1150.00,934.00" fill="#26744b"/>
<text x="48" y="1004" font-size="18.00" font-weight="bold" fill="#cb263b">돌려 해제하면 모터 전원이 즉시 복구됩니다. 재시작 인터록 없음. 토크 상실 시 팔이 떨어질 수 있습니다.</text>
<text x="48" y="1032" font-size="14.00" font-weight="normal" fill="#a32c32">* 퓨즈 및 컨버터 정격은 잠정값. 단일 접촉기 시제품 전원 차단 구성으로 안전 기능 검증은 완료되지 않음.</text>
<text x="48" y="1056" font-size="12.00" font-weight="normal" fill="#183249">근거: 프로젝트 Rev B 배선표 + Matek 제조사 사양. 실제 핀 배열과 최종 정격 확인 필요.</text>
</svg>
