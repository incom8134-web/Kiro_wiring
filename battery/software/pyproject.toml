[project]
name = "battery-monitor"
version = "1.0.0"
description = "Jetson Nano battery charge and discharge monitor"
requires-python = ">=3.9"
dependencies = [
  "smbus2>=0.4.3",
  "pyserial>=3.5",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
